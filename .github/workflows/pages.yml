name: Publish website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Rebuild calendars and site data
        run: uv run --no-dev saints-calendar
      - name: Fail if committed output is stale
        run: git diff --exit-code calendars site/days.json
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          rm -f _site/img/.gitkeep
          cp -r calendars _site/calendars
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
