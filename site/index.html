<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Svatí a jmeniny</title>
<meta name="description" content="Dnešní světec, jmeniny a kalendář na celý rok.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E✝%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="brand" href="./">Svatí a jmeniny</a>
  <nav><a href="./">Dnes</a><a href="about.html">Do kalendáře</a></nav>
</header>
<main>
  <section id="today" class="today" aria-live="polite"><p>Načítám…</p></section>

  <h2>Příštích 7 dní</h2>
  <ul id="week" class="week"></ul>

  <h2>Kalendář</h2>
  <div class="month-nav">
    <button id="prev" aria-label="Předchozí měsíc">‹</button>
    <h3 id="month-title"></h3>
    <button id="next" aria-label="Další měsíc">›</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="detail" class="detail"></div>
</main>
<footer>
  Světci podle Českého národního liturgického kalendáře (jen pevná data), jmeniny podle
  občanského kalendáře. <a href="https://github.com/mojzis/saints-calendar">Zdroj na GitHubu</a>.
</footer>
<script src="app.js"></script>
</body>
</html>
